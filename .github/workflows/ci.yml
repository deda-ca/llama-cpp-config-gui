name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          # node:sqlite (src/server/proxy/usageDb.ts) needs Node >= 22.5;
          # keep in sync with release.yml
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type check (server)
        run: npx tsc -p tsconfig.server.json --noEmit

      - name: Build client
        run: npx vite build

      - name: Run tests
        run: npx vitest run
